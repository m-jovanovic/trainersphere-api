name: Test 🧪

on:
  push:
  workflow_dispatch:

env:
  DOTNET_VERSION: ${{ secrets.DOTNET_VERSION }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies 🛠
        run: dotnet restore ./TrainerSphere.sln

      - name: Build 🧱
        run: dotnet build ./TrainerSphere.sln --configuration Release --no-restore

      - name: Test 🧪
        run: dotnet test ./TrainerSphere.sln --configuration Release --no-restore --verbosity normal
