name: Build 🧱

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "6.0.x"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET Core 📦
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies 🛠
        run: dotnet restore ./TrainerSphere.sln

      - name: Build 🧱
        run: dotnet build ./TrainerSphere.sln --configuration Release --no-restore
