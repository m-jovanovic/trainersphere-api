name: CI

on:
  push:
    branches: [main, modernize]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TrainerSphere.slnx

      - name: Build (warnings are errors)
        run: dotnet build TrainerSphere.slnx --configuration Release --no-restore

      # Integration tests start Postgres and Mailpit containers through Testcontainers (Docker is preinstalled).
      - name: Test
        run: dotnet test --solution TrainerSphere.slnx --configuration Release --no-build

  images:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Build compose images
        run: docker compose build
