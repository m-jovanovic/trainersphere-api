name: Test 🧪

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOTNET_VERSION: "6.0.x"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies 🛠
        run: dotnet restore ./TrainerSphere.sln

      - name: Build 🧱
        run: dotnet build ./TrainerSphere.sln --configuration Release --no-restore

      - name: Test 🧪
        run: |
            dotnet test ./test/Modules/Users/Modules.Users.Domain.UnitTests --configuration Release --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutput=../../../../ /p:CoverletOutputFormat=json
            dotnet test ./test/Modules/Users/Modules.Users.Application.UnitTests --configuration Release --no-build --verbosity normal /p:CollectCoverage=true /p:CoverletOutput=../../../../ /p:CoverletOutputFormat=cobertura /p:MergeWith=../../../../coverage.json

      - name: Publish Codecov 📢
        uses: codecov/codecov-action@v2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.cobertura.xml
          fail_ci_if_error: true
