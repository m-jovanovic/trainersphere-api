# Local stack: docker compose up --build
#   web      http://localhost:8080   (UI; nginx proxies /api to the api service)
#   api      http://localhost:5000   (Scalar docs at /scalar, OpenAPI at /openapi/v1.json)
#   mailpit  http://localhost:8025   (every email the app sends)
#   postgres localhost:5433          (trainersphere / trainersphere)
# Demo accounts are seeded on startup; password for all of them: Demo123!
name: trainersphere

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trainersphere
      POSTGRES_USER: trainersphere
      POSTGRES_PASSWORD: trainersphere
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainersphere -d trainersphere"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: .
      dockerfile: src/TrainerSphere.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Database: Host=postgres;Port=5432;Database=trainersphere;Username=trainersphere;Password=trainersphere
      Database__MigrateOnStartup: "true"
      Database__SeedDemoData: "true"
      # Local-only key; real deployments supply their own secret.
      Auth__SigningKey: compose-only-signing-key-change-me-0123456789abcdef
      # The stack is served over plain http, so the refresh cookie cannot be Secure here.
      Auth__RefreshCookieSecure: "false"
      App__WebBaseUrl: http://localhost:8080
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      OpenApi__Enabled: "true"
    ports:
      - "5000:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  postgres-data:
