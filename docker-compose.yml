version: '3.4'

services:
  app:
    image: ${DOCKER_REGISTRY-}app
    container_name: App
    build:
      context: .
      dockerfile: src/App/Dockerfile
    depends_on:
      - db

  db:
    image: postgres:14.1
    container_name: Database
    environment:
      - POSTGRES_DB=trainerhub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./_containers/database:/var/lib/postgresql/data
    ports:
      - 5100:5432

  db_management:
    image: dpage/pgadmin4:latest
    container_name: Database-UI
    depends_on:
      - db
    volumes:
      - ./_files/dev_servers.json:/pgadmin4/servers.json
      - ./_containers/database_ui:/var/lib/pgadmin
    ports:
      - "5101:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
