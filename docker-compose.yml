version: '3.4'

services:
  app:
    image: ${DOCKER_REGISTRY-}app
    build:
      context: .
      dockerfile: src/App/Dockerfile

  db:
    image: postgres:14.1
    environment:
      - POSTGRES_DB=trainerhub
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./_containers/database:/var/lib/postgresql/data
    ports:
      - 5100:5432
