name: Build 🧱

on:
  push:
  workflow_dispatch:

env:
  DOTNET_VERSION: "6.0.101"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup .NET Core 📦
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies 🛠
        run: dotnet restore ./TrainerHub.sln

      - name: Build 🧱
        run: dotnet build ./TrainerHub.sln --configuration Release --no-restore
